<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>503 Service Unavailable</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #0f1115;
        color: #e8eaed;
      }

      main {
        max-width: 36rem;
        text-align: center;
      }

      .status {
        display: inline-block;
        margin-bottom: 2rem;
        padding: 0.35rem 0.75rem;
        border: 1px solid #3a3f4b;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c5c9d1;
      }

      h1 {
        margin-bottom: 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 650;
        line-height: 1.2;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #b4b9c3;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">503 Service Unavailable</p>
      <h1>We'll be back shortly</h1>
      <p>
        The server is temporarily down for maintenance. Please try again later.
      </p>
    </main>
  </body>
</html>
